<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metbus COF - Control de Salidas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#16213a; --border:#2d3b57;
    --text:#e5e9f0; --muted:#8b98b3; --accent:#3b82f6; --accent2:#60a5fa;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --pending:#475569; --holiday:#a855f7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  .topbar{
    position:sticky; top:0; z-index:30; background:var(--panel);
    border-bottom:1px solid var(--border); padding:12px 16px;
    display:flex; flex-wrap:wrap; align-items:center; gap:16px; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .titleblock .sub{color:var(--muted); font-size:12px; margin-top:2px;}
  .syncstate{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block;}
  .dot.syncing{background:var(--accent2); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .role-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .role-btn{
    padding:6px 14px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer;
    border:1px solid var(--border); background:var(--bg); color:var(--muted);
  }
  .role-btn.active{border-color:transparent;}
  .role-btn.active.view{background:rgba(71,85,105,.4); color:var(--text);}
  .role-btn.active.cof{background:rgba(59,130,246,.2); color:var(--accent2); border-color:var(--accent2);}
  .role-btn.active.admin{background:rgba(168,85,247,.2); color:var(--holiday); border-color:var(--holiday);}
  .role-btn:hover{color:var(--text);}

  .export-btn{
    padding:8px 16px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer;
    border:1px solid var(--ok); background:rgba(34,197,94,.12); color:var(--ok);
  }
  .export-btn:hover{background:rgba(34,197,94,.22);}
  .export-btn:disabled{opacity:.5; cursor:wait;}

  .pin-btn{
    padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;
    border:1px solid var(--border); background:var(--bg); color:var(--muted);
  }
  .pin-btn:hover{ color:var(--text); border-color:var(--accent2); }

  .pinned-bar{
    gap:6px; padding:8px 16px; background:var(--panel2); border-bottom:1px solid var(--border);
    flex-wrap:wrap; align-items:center; position:sticky; top:65px; z-index:28;
  }
  .pinned-tab{
    display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:8px;
    background:var(--bg); border:1px solid var(--border); font-size:13px; font-weight:700;
    cursor:pointer; color:var(--muted);
  }
  .pinned-tab.active{ background:rgba(59,130,246,.15); border-color:var(--accent2); color:var(--accent2); }
  .pinned-tab:hover{ color:var(--text); }
  .pinned-remove{ color:var(--muted); font-weight:900; padding:0 2px; line-height:1; }
  .pinned-remove:hover{ color:var(--bad); }

  .selector-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .selector-bar label{font-size:12px; color:var(--muted); font-weight:600;}
  select{
    background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; font-size:14px; font-weight:600; cursor:pointer;
  }
  select:focus{outline:none; border-color:var(--accent);}
  #serviceSelect{min-width:110px;}
  #monthSelect{min-width:130px;}
  #daySelect{min-width:280px;}
  .tipo-pill{
    padding:4px 12px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
  }
  .tipo-pill.Laboral{background:rgba(59,130,246,.15); color:var(--accent2);}
  .tipo-pill.Sabado{background:rgba(245,158,11,.15); color:var(--warn);}
  .tipo-pill.Domingo{background:rgba(168,85,247,.15); color:var(--holiday);}
  .feriado-badge{
    padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700;
    background:rgba(168,85,247,.2); color:var(--holiday);
  }

  .tabs{display:flex; gap:4px; padding:8px 16px 0; background:var(--panel); position:sticky; top:65px; z-index:29; border-bottom:1px solid var(--border);}
  .tab{
    padding:10px 20px; cursor:pointer; border-radius:8px 8px 0 0; font-weight:600; font-size:14px;
    color:var(--accent2); background:transparent; border:1px solid transparent; border-bottom:none;
    text-decoration:none; display:inline-block;
  }
  .tab:hover{ color:var(--text); background:var(--panel2); }

  @media (max-width:900px){
    .content{grid-template-columns:1fr;}
    .tabs{display:flex;}
  }
  @media (min-width:901px){
    .tabs{display:none;}
  }

  @media (max-width:600px){
    .topbar{padding:10px 12px; gap:10px;}
    .brand svg{height:28px;}
    .selector-bar{width:100%; gap:8px;}
    .selector-bar label{width:100%; margin-bottom:-4px;}
    #serviceSelect, #monthSelect, #daySelect{flex:1; min-width:0; width:100%;}
    select{padding:10px 12px; font-size:15px;}
    .role-bar{width:100%; justify-content:flex-start;}
    .role-btn{padding:8px 14px; font-size:13px;}
    .syncstate{width:100%; justify-content:flex-end;}
    .content{padding:10px;}
    .period-header{padding:10px;}
    .period-name{font-size:13px;}
    .metrics{font-size:11px; gap:8px;}
    input[type=text]{padding:8px 6px; font-size:16px;}
    .admin-panel{padding:0 10px;}
    .admin-add-row{flex-direction:column; align-items:stretch;}
    .admin-add-row input[type=text], .admin-add-row select{width:100%;}
    .admin-dep-row{flex-wrap:wrap;}
  }

  .content{padding:16px; max-width:1700px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start;}
  .dir-section{margin-bottom:0; min-width:0;}
  .dir-heading{
    font-size:16px; font-weight:800; letter-spacing:.04em; color:var(--accent2);
    padding:10px 4px; position:sticky; top:65px; z-index:15; background:var(--bg);
    border-bottom:2px solid var(--border); margin-bottom:14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .period{margin-bottom:22px; background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .period-header{
    padding:12px 14px; background:var(--panel2); display:flex; flex-wrap:wrap; justify-content:space-between;
    align-items:center; gap:10px; border-bottom:1px solid var(--border);
  }
  .period-name{font-weight:700; font-size:14px;}
  .period-range{color:var(--muted); font-size:12px; font-weight:400; margin-left:8px;}
  .metrics{display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--muted);}
  .metrics b{color:var(--text); font-weight:600;}
  .metric-reg{font-weight:700;}
  .metric-reg.good{color:var(--ok);}
  .metric-reg.mid{color:var(--warn);}
  .metric-reg.bad{color:var(--bad);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .table-scroll table{min-width:640px;}
  thead th{
    text-align:left; padding:8px 10px; background:var(--panel2); color:var(--muted);
    font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
    border-bottom:1px solid var(--border);
  }
  tbody td{padding:6px 10px; border-bottom:1px solid var(--border);}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  .hora-teo{color:var(--muted); font-variant-numeric:tabular-nums;}
  .readonly-val{color:var(--text); font-size:13px; display:inline-block; min-height:20px;}
  .readonly-val.empty{color:var(--muted);}
  input[type=text]{
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px;
    color:var(--text); padding:6px 8px; font-size:13px; font-variant-numeric:tabular-nums;
  }
  input[type=text]:focus{outline:none; border-color:var(--accent);}
  input.hora-real{max-width:80px;}
  .badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;
    text-align:center; min-width:76px;
  }
  .badge.ok{background:rgba(34,197,94,.15); color:var(--ok);}
  .badge.atraso{background:rgba(239,68,68,.15); color:var(--bad);}
  .badge.adelantado{background:rgba(245,158,11,.15); color:var(--warn);}
  .badge.pendiente{background:rgba(71,85,105,.3); color:var(--muted);}

  .tipo-salida{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;
    text-align:center; white-space:nowrap;
  }
  .tipo-salida.comercial{background:rgba(34,197,94,.15); color:var(--ok);}
  .tipo-salida.posicionamiento{background:rgba(59,130,246,.15); color:var(--accent2);}
  .tipo-salida.retorno{background:rgba(245,158,11,.15); color:var(--warn);}

  tr.row-perdida td{ background:rgba(239,68,68,.16); }
  tr.row-perdida:hover td{ background:rgba(239,68,68,.24); }
  tr.row-perdida .hora-teo{ color:var(--bad); }
  .perdida-input{ width:18px; height:18px; cursor:pointer; }

  .footer-note{color:var(--muted); font-size:12px; text-align:center; padding:20px;}
  .empty-state{color:var(--muted); text-align:center; padding:40px; font-size:14px;}

  /* Admin maintainer styles */
  .admin-banner{
    max-width:1700px; margin:0 auto; padding:0 16px;
  }
  .admin-toggle-bar{
    max-width:1700px; margin:12px auto 0; padding:0 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .admin-toggle-btn{
    padding:8px 16px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer;
    border:1px solid var(--holiday); background:rgba(168,85,247,.12); color:var(--holiday);
  }
  .admin-toggle-btn:hover{background:rgba(168,85,247,.22);}
  .admin-panel{
    max-width:1700px; margin:16px auto; padding:0 16px;
    display:grid; grid-template-columns:1fr 1fr; gap:24px;
  }
  @media (max-width:900px){ .admin-panel{grid-template-columns:1fr;} }
  .admin-dir-block{background:var(--panel); border:1px solid var(--holiday); border-radius:10px; padding:14px; min-width:0;}
  .admin-dir-title{font-weight:800; color:var(--holiday); margin-bottom:10px; font-size:15px;}
  .admin-add-row{
    display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;
    background:var(--panel2); padding:10px; border-radius:8px;
  }
  .admin-add-row input[type=text]{width:80px;}
  .admin-add-row select{padding:6px 8px; font-size:12px;}
  .admin-add-btn{
    padding:7px 14px; border-radius:6px; background:var(--ok); color:#0f172a; border:none;
    font-weight:700; font-size:12px; cursor:pointer;
  }
  .admin-add-btn:hover{filter:brightness(1.1);}
  .admin-period-block{margin-bottom:14px;}
  .admin-period-title{font-size:12px; font-weight:700; color:var(--muted); padding:6px 4px; text-transform:uppercase; letter-spacing:.03em;}
  .admin-dep-row{
    display:flex; gap:6px; align-items:center; padding:5px 4px; border-bottom:1px solid var(--border);
  }
  .admin-dep-row input[type=text]{width:70px;}
  .admin-dep-row select{flex:1; padding:5px 6px; font-size:12px;}
  .admin-del-btn{
    background:rgba(239,68,68,.15); color:var(--bad); border:none; border-radius:6px;
    padding:5px 9px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .admin-del-btn:hover{background:rgba(239,68,68,.3);}
  .admin-empty-period{color:var(--muted); font-size:12px; padding:4px; font-style:italic;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-box{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:24px;
    width:320px; max-width:90vw;
  }
  .modal-box h3{margin:0 0 14px; font-size:15px;}
  .modal-box input[type=password]{
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:10px 12px; font-size:14px; margin-bottom:12px;
  }
  .modal-actions{display:flex; gap:8px; justify-content:flex-end;}
  .modal-btn{
    padding:8px 16px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; border:none;
  }
  .modal-btn.cancel{background:var(--panel2); color:var(--muted);}
  .modal-btn.confirm{background:var(--accent); color:white;}
  .modal-error{color:var(--bad); font-size:12px; margin:-6px 0 12px; display:none;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg viewBox="0 0 220 48" xmlns="http://www.w3.org/2000/svg" style="height:34px;width:auto;">
  <rect x="0" y="6" width="36" height="36" rx="8" fill="#22c55e"/>
  <path d="M8 30 L8 18 Q8 14 12 14 L24 14 Q28 14 28 18 L28 30" stroke="#0f172a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="13" cy="30" r="2.6" fill="#0f172a"/>
  <circle cx="23" cy="30" r="2.6" fill="#0f172a"/>
  <rect x="11" y="17" width="14" height="7" rx="1.5" fill="#0f172a"/>
  <text x="44" y="31" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="800" fill="#e5e9f0">MET<tspan fill="#22c55e">BUS</tspan></text>
</svg>
    <div class="titleblock">
      <div class="sub">COF &middot; Control de Salidas</div>
    </div>
  </div>
  <div class="selector-bar">
    <label for="serviceSelect">Servicio:</label>
    <select id="serviceSelect"></select>
    <button class="pin-btn" id="pinServiceBtn" title="Fijar este servicio arriba, como una pesta&ntilde;a">&#128204; Fijar</button>
    <label for="monthSelect">Mes:</label>
    <select id="monthSelect"></select>
    <label for="daySelect">D&iacute;a:</label>
    <select id="daySelect"></select>
    <span class="tipo-pill" id="tipoPill"></span>
    <span class="feriado-badge" id="feriadoBadge" style="display:none;"></span>
  </div>
  <div class="role-bar">
    <span class="role-btn active view" id="roleBtnView" data-role="view">Visualizaci&oacute;n</span>
    <span class="role-btn" id="roleBtnCof" data-role="cof">COF</span>
    <span class="role-btn" id="roleBtnAdmin" data-role="admin">Administrador</span>
  </div>
  <button class="export-btn" id="exportExcelBtn">Exportar Excel del d&iacute;a</button>
  <div class="syncstate"><span class="dot" id="syncDot"></span><span id="syncText">Sincronizado</span></div>
</div>

<div class="pinned-bar" id="pinnedBar" style="display:none;"></div>

<div class="tabs">
  <a class="tab" href="#seccion-ida">Ir a IDA</a>
  <a class="tab" href="#seccion-regreso">Ir a REGRESO</a>
</div>

<div class="admin-toggle-bar" id="adminToggleBar" style="display:none;">
  <button class="admin-toggle-btn" id="adminMaintainerToggle">Abrir Mantenedor de Horarios Te&oacute;ricos</button>
</div>

<div class="admin-panel" id="adminPanel" style="display:none;"></div>

<div class="content" id="content"></div>
<div class="footer-note">Bus, Rol conductor, Hora Real y Observaci&oacute;n se guardan por servicio y d&iacute;a espec&iacute;fico, y se comparten en vivo con todos los que tengan esta planilla abierta.</div>

// ---------- Firebase Realtime Database (backend gratuito) ----------
const FIREBASE_URL = 'https://metbus-cof-default-rtdb.firebaseio.com';

function tipodiaPathSafe(tipodia){
  // Firebase paths must stay plain ASCII, so strip the accent for "Sábado".
  return tipodia === 'Sábado' ? 'Sabado' : tipodia;
}
function realDataPath(servicio, fecha){
  return `realdata/${servicio}/${fecha.replace(/-/g,'_')}`;
}
function schedulePath(servicio, tipodia){
  return `schedule/${servicio}/${tipodiaPathSafe(tipodia)}`;
}
async function fbGet(path){
  const res = await fetch(`${FIREBASE_URL}/${path}.json`);
  if(!res.ok) throw new Error('Firebase GET failed: ' + res.status);
  return await res.json();
}
async function fbSet(path, value){
  const res = await fetch(`${FIREBASE_URL}/${path}.json`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(value)
  });
  if(!res.ok) throw new Error('Firebase PUT failed: ' + res.status);
  return await res.json();
}

function timeToMinutes(t){
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}
function normalizeTime(raw){
  raw = raw.trim();
  if(!raw) return '';
  raw = raw.replace(/[^0-9:]/g,'');
  if(raw.includes(':')){
    let [h,m] = raw.split(':');
    h = h.padStart(2,'0'); m = (m||'00').padEnd(2,'0').slice(0,2);
    if(Number(h)>23) h='23';
    if(Number(m)>59) m='59';
    return `${h}:${m}`;
  }
  if(raw.length<=2){
    let h = raw.padStart(2,'0');
    if(Number(h)>23) h='23';
    return `${h}:00`;
  }
  if(raw.length===3){
    let h = raw.slice(0,1).padStart(2,'0');
    let m = raw.slice(1);
    if(Number(m)>59) m='59';
    return `${h}:${m}`;
  }
  let h = raw.slice(0,2);
  let m = raw.slice(2,4);
  if(Number(h)>23) h='23';
  if(Number(m)>59) m='59';
  return `${h}:${m}`;
}
function calcEstado(horaTeo, horaReal){
  if(!horaReal) return {label:'Pendiente', cls:'pendiente'};
  const diff = timeToMinutes(horaReal) - timeToMinutes(horaTeo);
  if(diff > 3) return {label:'Atraso', cls:'atraso'};
  if(diff < -3) return {label:'Adelantado', cls:'adelantado'};
  return {label:'OK', cls:'ok'};
}
function stdDev(arr){
  if(arr.length < 2) return 0;
  const mean = arr.reduce((a,b)=>a+b,0)/arr.length;
  const variance = arr.reduce((a,b)=>a+(b-mean)**2,0)/arr.length;
  return Math.sqrt(variance);
}
function computeIntervals(times){
  const mins = times.filter(Boolean).map(timeToMinutes).sort((a,b)=>a-b);
  const intervals = [];
  for(let i=1;i<mins.length;i++) intervals.push(mins[i]-mins[i-1]);
  return intervals;
}
function tipoSalidaInfo(tipo){
  if(tipo === 2) return {label:'Posicionamiento', cls:'posicionamiento'};
  if(tipo === 3) return {label:'Retorno', cls:'retorno'};
  return {label:'Comercial', cls:'comercial'};
}

// ---------- Schedule loading / grouping ----------
async function getScheduleFlat(servicio, tipodia){
  const cacheKey = `${servicio}|${tipodia}`;
  if(scheduleCache[cacheKey]) return scheduleCache[cacheKey];
  let sched = null;
  try{
    const value = await fbGet(schedulePath(servicio, tipodia));
    if(value) sched = value;
  }catch(err){ sched = null; }
  if(!sched){
    const def = (SCHEDULE_FLAT_DEFAULT[servicio] && SCHEDULE_FLAT_DEFAULT[servicio][tipodia]) || {IDA:[],REGRESO:[]};
    sched = { IDA: def.IDA.slice(), REGRESO: def.REGRESO.slice() };
  }
  scheduleCache[cacheKey] = sched;
  return sched;
}

let scheduleSaveQueue = Promise.resolve();
async function saveScheduleFlat(servicio, tipodia, sched){
  const cacheKey = `${servicio}|${tipodia}`;
  scheduleCache[cacheKey] = sched;
  const thisSave = scheduleSaveQueue.then(async () => {
    try{
      await fbSet(schedulePath(servicio, tipodia), sched);
    }catch(err){ console.error('Error guardando horario', err); }
  });
  scheduleSaveQueue = thisSave;
  await thisSave;
}

function groupByPeriod(flatList, tipodia, includeEmpty){
  const defs = PERIODOS_DEFINICION[tipodia];
  const sorted = flatList.slice().sort((a,b)=> a.hora.localeCompare(b.hora));
  const result = [];
  defs.forEach(p => {
    const deps = sorted.filter(s => s.hora >= p.hora_inicio && s.hora <= p.hora_fin);
    if(deps.length === 0 && !includeEmpty) return;
    result.push({
      periodo_ts: p.periodo_ts, nombre: p.nombre,
      hora_inicio: p.hora_inicio, hora_fin: p.hora_fin,
      salidas: deps
    });
  });
  return result;
}

async function renderDirSection(dir){
  const info = getDayInfo(currentDate);
  const tipo = info.tipo_dia;
  const flatSched = await getScheduleFlat(currentService, tipo);
  const periods = groupByPeriod(flatSched[dir], tipo, false);

  const section = document.createElement('div');
  section.className = 'dir-section';
  section.id = dir === 'IDA' ? 'seccion-ida' : 'seccion-regreso';

  const heading = document.createElement('div');
  heading.className = 'dir-heading';
  heading.textContent = dir;
  section.appendChild(heading);

  if(periods.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'Sin salidas programadas para este sentido en este tipo de día.';
    section.appendChild(empty);
    return section;
  }

  const canEditRealData = (currentRole === 'cof' || currentRole === 'admin');

  periods.forEach(period => {
    const wrap = document.createElement('div');
    wrap.className = 'period';
    const header = document.createElement('div');
    header.className = 'period-header';
    const nameDiv = document.createElement('div');
    nameDiv.innerHTML = `<span class="period-name">${period.nombre}</span><span class="period-range">${period.hora_inicio} - ${period.hora_fin}</span>`;
    const metricsDiv = document.createElement('div');
    metricsDiv.className = 'metrics';
    header.appendChild(nameDiv); header.appendChild(metricsDiv);
    wrap.appendChild(header);

    const tableScroll = document.createElement('div');
    tableScroll.className = 'table-scroll';
    const table = document.createElement('table');
    table.innerHTML = `<thead><tr>
        <th style="width:70px;">Bus</th>
        <th style="width:90px;">Hora Te&oacute;rica</th>
        <th style="width:100px;">Hora Real</th>
        <th style="width:130px;">Rol Conductor</th>
        <th style="width:100px;">Estado</th>
        <th style="width:130px;">Tipo Salida</th>
        <th style="width:90px;">P&eacute;rdida</th>
        <th>Observaci&oacute;n</th>
      </tr></thead><tbody></tbody>`;
    const tbody = table.querySelector('tbody');

    period.salidas.forEach(sal => {
      const key = `${dir}|${sal.hora}|${sal.tipo}`;
      const rec = realData[key] || {bus:'', real:'', rol:'', obs:'', perdida:false};
      const tr = document.createElement('tr');
      if(rec.perdida) tr.classList.add('row-perdida');
      const estado = calcEstado(sal.hora, rec.real);
      const tipoInfo = tipoSalidaInfo(sal.tipo);
      if(canEditRealData){
        tr.innerHTML = `
          <td><input type="text" class="bus-input" data-key="${key}" value="${rec.bus||''}" placeholder="-"></td>
          <td class="hora-teo">${sal.hora}</td>
          <td><input type="text" class="hora-real-input hora-real" data-key="${key}" data-teo="${sal.hora}" value="${rec.real||''}" placeholder="--:--"></td>
          <td><input type="text" class="rol-input" data-key="${key}" value="${rec.rol||''}" placeholder="-"></td>
          <td><span class="badge ${estado.cls}" data-badge="${key}">${estado.label}</span></td>
          <td><span class="tipo-salida ${tipoInfo.cls}">${tipoInfo.label}</span></td>
          <td style="text-align:center;"><input type="checkbox" class="perdida-input" data-key="${key}" ${rec.perdida ? 'checked' : ''} title="Marcar como p\u00e9rdida de servicio"></td>
          <td><input type="text" class="obs-input" data-key="${key}" value="${rec.obs||''}" placeholder="-"></td>
        `;
      } else {
        const val = (v) => v ? `<span class="readonly-val">${v}</span>` : `<span class="readonly-val empty">-</span>`;
        tr.innerHTML = `
          <td>${val(rec.bus)}</td>
          <td class="hora-teo">${sal.hora}</td>
          <td>${val(rec.real)}</td>
          <td>${val(rec.rol)}</td>
          <td><span class="badge ${estado.cls}">${estado.label}</span></td>
          <td><span class="tipo-salida ${tipoInfo.cls}">${tipoInfo.label}</span></td>
          <td style="text-align:center;"><input type="checkbox" disabled ${rec.perdida ? 'checked' : ''}></td>
          <td>${val(rec.obs)}</td>
        `;
      }
      tbody.appendChild(tr);
    });

    wrap.appendChild(tableScroll);
    tableScroll.appendChild(table);
    section.appendChild(wrap);
    const progTimes = period.salidas.filter(s => (s.tipo||1) === 1).map(s=>s.hora);
    const realTimes = period.salidas
      .filter(s => (s.tipo||1) === 1)
      .filter(s => !((realData[`${dir}|${s.hora}|${s.tipo}`]||{}).perdida))
      .map(s => (realData[`${dir}|${s.hora}|${s.tipo}`]||{}).real)
      .filter(Boolean)
      .filter(r => r >= period.hora_inicio && r <= period.hora_fin);
    const progInt = computeIntervals(progTimes);
    const realInt = computeIntervals(realTimes);
    const avgProg = progInt.length ? (progInt.reduce((a,b)=>a+b,0)/progInt.length) : null;
    const avgReal = realInt.length ? (realInt.reduce((a,b)=>a+b,0)/realInt.length).toFixed(1) : '-';
    let regularidad = '-'; let regClass = '';
    if(realInt.length >= 1 && avgProg !== null && avgProg > 0){
      // Holgura: 40% del intervalo teórico del período, acotada entre 3 y 30 min.
      const holgura = Math.min(30, Math.max(3, avgProg * 0.4));
      const intervaloMax = avgProg + holgura;
      const cumplen = realInt.filter(iv => iv <= intervaloMax).length;
      const reg = (cumplen / realInt.length) * 100;
      regularidad = reg.toFixed(0) + '%';
      regClass = reg>=85 ? 'good' : (reg>=65 ? 'mid' : 'bad');
    }
    const avgProgLabel = avgProg !== null ? avgProg.toFixed(1) : '-';
    metricsDiv.innerHTML = `
      <span>Program.: <b>${progTimes.length}</b></span>
      <span>Real: <b>${realTimes.length}</b></span>
      <span>Interv. prog.: <b>${avgProgLabel}</b> min</span>
      <span>Interv. real: <b>${avgReal}</b> min</span>
      <span>Regularidad: <b class="metric-reg ${regClass}">${regularidad}</b></span>
    `;
  });

  return section;
}

// Enter / Tab move focus to the next editable cell in reading order (Bus →
// Hora Real → Rol → Observación, then the next row), but only within the
// same dirección (IDA or REGRESO) the field belongs to — never crosses over
// to the other column. Shift+Tab moves backward the same way.
function getEditableInputsInSection(dir){
  const sectionId = dir === 'IDA' ? 'seccion-ida' : 'seccion-regreso';
  const section = document.getElementById(sectionId);
  if(!section) return [];
  return Array.from(section.querySelectorAll('.bus-input, .hora-real-input, .rol-input, .obs-input'));
}
function onEditableFieldKeydown(e){
  if(e.key !== 'Enter' && e.key !== 'Tab') return;
  const inp = e.target;
  const dir = (inp.dataset.key || '').split('|')[0];
  if(dir !== 'IDA' && dir !== 'REGRESO') return;
  e.preventDefault();
  moveToNextEditableField(inp, dir, e.key === 'Tab' && e.shiftKey);
}
async function moveToNextEditableField(inp, dir, backward){
  const inputsBefore = getEditableInputsInSection(dir);
  const idx = inputsBefore.indexOf(inp);
  if(idx === -1) return;
  const nextIdx = idx + (backward ? -1 : 1);

  // Commit the value first (this triggers a full re-render, which recreates
  // every input element) before touching focus, otherwise the freshly
  // focused element gets destroyed mid-transition and focus is lost.
  if(inp.classList.contains('hora-real-input')){
    inp.value = normalizeTime(inp.value);
  }
  const key = inp.dataset.key;
  if(!realData[key]) realData[key] = {bus:'', real:'', rol:'', obs:''};
  if(inp.classList.contains('bus-input')) realData[key].bus = inp.value;
  if(inp.classList.contains('rol-input')) realData[key].rol = inp.value;
  if(inp.classList.contains('hora-real-input')) realData[key].real = inp.value;
  if(inp.classList.contains('obs-input')) realData[key].obs = inp.value;

  await saveRealData();
  await render();

  if(nextIdx >= 0 && nextIdx < inputsBefore.length){
    const inputsAfter = getEditableInputsInSection(dir);
    const nextInput = inputsAfter[nextIdx];
    if(nextInput){ nextInput.focus(); nextInput.select(); }
  }
}
function onHoraRealChange(e){
  const val = normalizeTime(e.target.value);
  const key = e.target.dataset.key;
  const previous = (realData[key] && realData[key].real) || '';
  e.target.value = val;
  if(val === previous) return; // nothing actually changed, skip redundant save
  onFieldChange(e);
}
function onFieldChange(e){
  const key = e.target.dataset.key;
  if(!realData[key]) realData[key] = {bus:'', real:'', rol:'', obs:'', perdida:false};
  if(e.target.classList.contains('bus-input')) realData[key].bus = e.target.value;
  if(e.target.classList.contains('rol-input')) realData[key].rol = e.target.value;
  if(e.target.classList.contains('hora-real-input')) realData[key].real = e.target.value;
  if(e.target.classList.contains('obs-input')) realData[key].obs = e.target.value;
  if(e.target.classList.contains('perdida-input')) realData[key].perdida = e.target.checked;
  saveRealData();
  render();
}
let saveQueue = Promise.resolve();
async function saveRealData(){
  setSyncing(true);
  // Chain saves one after another (never in parallel). Each save reads
  // realData at the moment it actually runs, so if several fields are
  // edited in quick succession, every write still reflects everything typed
  // so far and later writes can never be overtaken by an earlier, stale one.
  const thisSave = saveQueue.then(async () => {
    try{
      await fbSet(realDataPath(currentService, currentDate), realData);
    }catch(err){ console.error('Error guardando', err); }
  });
  saveQueue = thisSave;
  await thisSave;
  setSyncing(false);
}
async function loadAndRender(){
  setSyncing(true);
  document.getElementById('serviceSelect').value = currentService;
  document.getElementById('monthSelect').value = currentMonth;
  document.getElementById('daySelect').value = currentDate;
  renderPinnedBar();
  try{
    const value = await fbGet(realDataPath(currentService, currentDate));
    realData = value || {};
  }catch(err){ realData = {}; }
  await migrateOldKeysIfNeeded();
  setSyncing(false);
  await render();
}

// One-time recovery: earlier versions of this app saved each row under a
// "dir|periodo_ts|idx" key. The current version uses "dir|hora". If any
// old-format keys are found, translate them to the new format so previously
// entered data (Bus, Hora Real, Rol, Observación) shows up again instead of
// appearing lost.
async function migrateOldKeysIfNeeded(){
  // Old format (very first version): "dir|periodo_ts|idx", e.g. "IDA|4|2".
  // Current format: "dir|hora|tipo", e.g. "IDA|06:30|1".
  // Both happen to have 3 parts, so we tell them apart by checking whether
  // the middle part looks like an "HH:MM" time (current format) or a small
  // period-number (old format).
  const isOldFormat = (k) => {
    const parts = k.split('|');
    if(parts.length !== 3) return false;
    return !/^\d{2}:\d{2}$/.test(parts[1]);
  };
  const oldKeys = Object.keys(realData).filter(isOldFormat);
  if(oldKeys.length === 0) return;

  const info = getDayInfo(currentDate);
  const tipodia = info.tipo_dia;
  let changed = false;

  for(const dir of ['IDA','REGRESO']){
    const flatSched = await getScheduleFlat(currentService, tipodia);
    const periods = groupByPeriod(flatSched[dir], tipodia, false);
    const periodMap = {};
    periods.forEach(p => { periodMap[p.periodo_ts] = p.salidas; });

    oldKeys.forEach(k => {
      const [kdir, pts, idx] = k.split('|');
      if(kdir !== dir) return;
      const salidas = periodMap[pts];
      if(!salidas) return;
      const sal = salidas[Number(idx)];
      if(!sal) return;
      const newKey = `${dir}|${sal.hora}|${sal.tipo}`;
      if(!realData[newKey]){
        realData[newKey] = realData[k];
        changed = true;
      }
      delete realData[k];
      changed = true;
    });
  }

  // Intermediate format (used briefly before this fix): "dir|hora", with no
  // tipo. This is exactly the format that caused Comercial and
  // Posicionamiento/Retorno departures sharing the same hora to collide.
  // We recover it by matching hora against the current schedule; if more
  // than one departure shares that hora (the ambiguous case), we prefer the
  // Comercial one since it is the most likely intended entry.
  const isTwoPartFormat = (k) => k.split('|').length === 2;
  const twoPartKeys = Object.keys(realData).filter(isTwoPartFormat);
  if(twoPartKeys.length > 0){
    for(const dir of ['IDA','REGRESO']){
      const flatSched = await getScheduleFlat(currentService, tipodia);
      twoPartKeys.forEach(k => {
        const [kdir, hora] = k.split('|');
        if(kdir !== dir) return;
        const candidates = flatSched[dir].filter(s => s.hora === hora);
        if(candidates.length === 0) return; // schedule changed since, can't recover safely
        const chosen = candidates.find(s => (s.tipo||1) === 1) || candidates[0];
        const newKey = `${dir}|${hora}|${chosen.tipo}`;
        if(!realData[newKey]){
          realData[newKey] = realData[k];
          changed = true;
        }
        delete realData[k];
        changed = true;
      });
    }
  }

  if(changed) await saveRealData();
}
function setSyncing(state){
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  if(state){ dot.classList.add('syncing'); text.textContent = 'Cargando...'; }
  else { dot.classList.remove('syncing'); text.textContent = 'Sincronizado'; }
}
async function pollUpdates(){
  try{
    const value = await fbGet(realDataPath(currentService, currentDate));
    const remote = value || {};
    if(JSON.stringify(remote) !== JSON.stringify(realData)){
      realData = remote;
      await render();
    }
  }catch(err){}
  // also refresh schedule cache in case another admin changed it
  const info = getDayInfo(currentDate);
  const cacheKey = `${currentService}|${info.tipo_dia}`;
  try{
    const remoteSched = await fbGet(schedulePath(currentService, info.tipo_dia));
    if(remoteSched){
      if(JSON.stringify(remoteSched) !== JSON.stringify(scheduleCache[cacheKey])){
        scheduleCache[cacheKey] = remoteSched;
        await render();
      }
    }
  }catch(err){}
}

// ---------- Admin Maintainer Panel ----------
async function renderAdminPanel(){
  const panel = document.getElementById('adminPanel');
  panel.innerHTML = '';
  const info = getDayInfo(currentDate);
  const tipodia = info.tipo_dia;

  for(const dir of ['IDA','REGRESO']){
    const flatSched = await getScheduleFlat(currentService, tipodia);
    const block = document.createElement('div');
    block.className = 'admin-dir-block';
    block.innerHTML = `<div class="admin-dir-title">Mantenedor &mdash; ${dir} (${currentService}, ${tipodia})</div>`;

    // add-row form
    const addRow = document.createElement('div');
    addRow.className = 'admin-add-row';
    addRow.innerHTML = `
      <input type="text" class="admin-new-hora" placeholder="HH:MM" data-dir="${dir}">
      <select class="admin-new-tipo" data-dir="${dir}">
        <option value="1">Comercial</option>
        <option value="2">Posicionamiento</option>
        <option value="3">Retorno</option>
      </select>
      <button class="admin-add-btn" data-dir="${dir}">+ Agregar salida</button>
    `;
    block.appendChild(addRow);

    const periods = groupByPeriod(flatSched[dir], tipodia, true);
    periods.forEach(period => {
      const pblock = document.createElement('div');
      pblock.className = 'admin-period-block';
      pblock.innerHTML = `<div class="admin-period-title">${period.nombre} (${period.hora_inicio}-${period.hora_fin})</div>`;
      if(period.salidas.length === 0){
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'admin-empty-period';
        emptyDiv.textContent = 'Sin salidas en este período.';
        pblock.appendChild(emptyDiv);
      } else {
        period.salidas.forEach(sal => {
          const row = document.createElement('div');
          row.className = 'admin-dep-row';
          row.innerHTML = `
            <input type="text" class="admin-hora-edit" value="${sal.hora}" data-dir="${dir}" data-orig-hora="${sal.hora}">
            <select class="admin-tipo-edit" data-dir="${dir}" data-orig-hora="${sal.hora}">
              <option value="1" ${sal.tipo===1?'selected':''}>Comercial</option>
              <option value="2" ${sal.tipo===2?'selected':''}>Posicionamiento</option>
              <option value="3" ${sal.tipo===3?'selected':''}>Retorno</option>
            </select>
            <button class="admin-del-btn" data-dir="${dir}" data-orig-hora="${sal.hora}">Eliminar</button>
          `;
          pblock.appendChild(row);
        });
      }
      block.appendChild(pblock);
    });

    panel.appendChild(block);
  }

  attachAdminListeners();
}

async function updateScheduleEntry(dir, origHora, newHora, newTipo, deleteIt){
  const info = getDayInfo(currentDate);
  const tipodia = info.tipo_dia;
  const flatSched = await getScheduleFlat(currentService, tipodia);
  const list = flatSched[dir];
  const idx = list.findIndex(x => x.hora === origHora);
  if(idx === -1) return;
  if(deleteIt){
    list.splice(idx,1);
  } else {
    list[idx] = { hora: newHora, tipo: newTipo };
  }
  await saveScheduleFlat(currentService, tipodia, flatSched);
  await renderAdminPanel();
  await render();
}

async function addScheduleEntry(dir, hora, tipo){
  const info = getDayInfo(currentDate);
  const tipodia = info.tipo_dia;
  const flatSched = await getScheduleFlat(currentService, tipodia);
  if(flatSched[dir].some(x => x.hora === hora)){
    alert('Ya existe una salida a esa hora en ' + dir + '. Edita la existente o usa otra hora.');
    return;
  }
  flatSched[dir].push({ hora, tipo });
  await saveScheduleFlat(currentService, tipodia, flatSched);
  await renderAdminPanel();
  await render();
}

function attachAdminListeners(){
  document.querySelectorAll('.admin-add-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const dir = btn.dataset.dir;
      const horaInput = document.querySelector(`.admin-new-hora[data-dir="${dir}"]`);
      const tipoSelect = document.querySelector(`.admin-new-tipo[data-dir="${dir}"]`);
      const hora = normalizeTime(horaInput.value);
      if(!hora){ alert('Ingresa una hora válida.'); return; }
      const tipo = Number(tipoSelect.value);
      await addScheduleEntry(dir, hora, tipo);
    });
  });
  document.querySelectorAll('.admin-del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('¿Eliminar esta salida teórica? Esta acción no se puede deshacer.')) return;
      await updateScheduleEntry(btn.dataset.dir, btn.dataset.origHora, null, null, true);
    });
  });
  document.querySelectorAll('.admin-hora-edit').forEach(inp => {
    inp.addEventListener('blur', async () => {
      const dir = inp.dataset.dir;
      const origHora = inp.dataset.origHora;
      const newHora = normalizeTime(inp.value);
      if(!newHora || newHora === origHora) { inp.value = origHora; return; }
      const tipoSel = document.querySelector(`.admin-tipo-edit[data-dir="${dir}"][data-orig-hora="${origHora}"]`);
      const tipo = Number(tipoSel.value);
      await updateScheduleEntry(dir, origHora, newHora, tipo, false);
    });
  });
  document.querySelectorAll('.admin-tipo-edit').forEach(sel => {
    sel.addEventListener('change', async () => {
      const dir = sel.dataset.dir;
      const origHora = sel.dataset.origHora;
      const tipo = Number(sel.value);
      await updateScheduleEntry(dir, origHora, origHora, tipo, false);
    });
  });
}

populateServiceSelector();
populateMonthSelector();
populateDaySelector();
loadAndRender();
syncTimer = setInterval(pollUpdates, 8000);

// ---------- Export to Excel (one sheet per servicio, for the selected day) ----------
document.getElementById('exportExcelBtn').addEventListener('click', exportExcelDelDia);

async function exportExcelDelDia(){
  const btn = document.getElementById('exportExcelBtn');
  const originalText = btn.textContent;
  btn.disabled = true;

  try{
    const info = getDayInfo(currentDate);
    const tipodia = info.tipo_dia;

    const wb = XLSX.utils.book_new();

    // Fetch every servicio's real data for this exact date in parallel.
    btn.textContent = 'Descargando datos...';
    const realDataByService = {};
    await Promise.all(SERVICIOS.map(async (serv) => {
      try{
        const value = await fbGet(realDataPath(serv, currentDate));
        realDataByService[serv] = value || {};
      }catch(err){
        realDataByService[serv] = {};
      }
    }));

    btn.textContent = 'Generando Excel...';
    for(const serv of SERVICIOS){
      const flatSched = await getScheduleFlat(serv, tipodia);
      const servRealData = realDataByService[serv] || {};
      const rows = [];

      for(const dir of ['IDA','REGRESO']){
        const periods = groupByPeriod(flatSched[dir], tipodia, false);
        periods.forEach(period => {
          period.salidas.forEach(sal => {
            const key = `${dir}|${sal.hora}|${sal.tipo}`;
            const rec = servRealData[key] || {};
            const estado = calcEstado(sal.hora, rec.real);
            const tipoInfo = tipoSalidaInfo(sal.tipo);
            rows.push({
              'Direcci\u00f3n': dir,
              'Per\u00edodo': period.nombre,
              'Hora Te\u00f3rica': sal.hora,
              'Bus': rec.bus || '',
              'Hora Real': rec.real || '',
              'Rol Conductor': rec.rol || '',
              'Estado': estado.label,
              'Tipo Salida': tipoInfo.label,
              'P\u00e9rdida': rec.perdida ? 'S\u00ed' : 'No',
              'Observaci\u00f3n': rec.obs || ''
            });
          });
        });
      }

      if(rows.length === 0){
        rows.push({ 'Direcci\u00f3n': '', 'Per\u00edodo': 'Sin salidas programadas', 'Hora Te\u00f3rica': '', 'Bus': '', 'Hora Real': '', 'Rol Conductor': '', 'Estado': '', 'Tipo Salida': '', 'P\u00e9rdida': '', 'Observaci\u00f3n': '' });
      }

      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = [
        {wch:10}, {wch:26}, {wch:12}, {wch:8}, {wch:10}, {wch:16}, {wch:12}, {wch:16}, {wch:9}, {wch:24}
      ];
      // Excel sheet names: max 31 chars, no \ / ? * [ ] :
      const sheetName = String(serv).slice(0,31).replace(/[\\/?*\[\]:]/g, '_');
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    }

    const fileName = `Metbus_COF_${currentDate}.xlsx`;
    XLSX.writeFile(wb, fileName);
  }catch(err){
    console.error('Error exportando Excel', err);
    alert('Hubo un problema generando el Excel. Intenta de nuevo.');
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
}
